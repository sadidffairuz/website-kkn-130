<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Kegiatan - KKN Berdampak</title>
    <!-- Sesuaikan link CSS dengan struktur folder Anda -->
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/variable.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/logbook.css">
</head>
<body>
    <!-- 1. NAVBAR (Gunakan navbar yang sama dengan halaman lain) -->
    <nav class="navbar">
        <div class="container navbar-container">
            <a href="../index.html" class="navbar-logo">
                <span class="logo-text">KKN Berdampak</span>
            </a>
            <!-- Tambahkan menu lengkap Anda di sini -->
        </div>
    </nav>

    <!-- 2. KONTEN DETAIL LOGBOOK -->
    <main class="container" style="margin-top: 100px; min-height: 70vh;">
        <!-- Tombol Kembali -->
        <a href="logbook.html" class="btn btn-outline" style="margin-bottom: 24px; display: inline-block;">
            &larr; Kembali ke Logbook
        </a>

        <!-- Wadah yang akan diisi oleh JavaScript -->
        <div id="detail-content" style="background: var(--color-surface); padding: 32px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <h1 id="detail-title" style="margin-bottom: 16px; color: var(--color-primary);">Memuat Data...</h1>
            
            <div style="display: flex; gap: 16px; margin-bottom: 24px; color: var(--color-text-light);">
                <span id="detail-date">🕒 -</span>
                <span id="detail-location">📍 -</span>
            </div>

            <div id="detail-tags" style="margin-bottom: 24px; display: flex; gap: 8px;">
                <!-- Tag akan muncul di sini -->
            </div>

            <h3 style="margin-bottom: 8px;">Deskripsi Kegiatan:</h3>
            <p id="detail-desc" style="line-height: 1.6; margin-bottom: 24px;">-</p>

            <h3 style="margin-bottom: 8px;">Kehadiran:</h3>
            <p id="detail-attendance">-</p>
        </div>
    </main>

    <!-- Script Pemanggil Data -->
    <script src="../js/detail-logbook.js"></script>
</body>
</html>
